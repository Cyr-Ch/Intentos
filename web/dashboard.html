<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IntentOS · Repository</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#111a2d;--line:#27364e;--text:#e8eef8;--muted:#91a3bd;--cyan:#4dd4d4;--green:#55d6a6;--amber:#ffc76c;--red:#ff7d8a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#182942 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    header{display:flex;align-items:center;gap:24px;padding:18px 28px;border-bottom:1px solid var(--line);background:#0b1020e8;position:sticky;top:0;z-index:2}header h1{font-size:18px;letter-spacing:.02em;margin:0}header h1 span{color:var(--cyan)}header small{color:var(--muted)}nav{display:flex;gap:6px;margin-left:auto}button{cursor:pointer;border:1px solid var(--line);background:#1a2940;color:var(--text);border-radius:8px;padding:8px 12px;font:inherit}button:hover{border-color:var(--cyan)}button.active{background:#23465a;border-color:var(--cyan)}button.primary{background:#166364;border-color:#2c9997}button:disabled{opacity:.5;cursor:default}
    main{max-width:1460px;margin:auto;padding:24px 28px 60px}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.hero h2{font-size:27px;margin:3px 0}.sub{color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 12px var(--green)}.grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);background:linear-gradient(155deg,#142038,#101a2e);border-radius:14px;overflow:hidden}.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}.panel-body{padding:18px}.runs{max-height:680px;overflow:auto}.run{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:15px 18px}.run:hover,.run.active{background:#1b3048}.run strong{display:block;font-size:13px}.run .task{display:block;color:var(--muted);font-size:12px;margin-top:5px}.run .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}.badge.good{color:var(--green);border-color:#326c5e}.badge.warn{color:var(--amber);border-color:#765d35}.badge.bad{color:var(--red);border-color:#753e4b}.id{color:var(--muted);font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}
    .pipeline{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.step{padding:12px 7px;text-align:center;background:#1b2940;border:1px solid var(--line);border-radius:8px;min-height:60px}.step.done{background:#143f41;border-color:#2b7271}.step.active{background:#4c3b24;border-color:var(--amber);box-shadow:0 0 0 2px #ffc76c25}.step .n{font-size:11px;color:var(--muted)}.step strong{display:block;font-size:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}.stat:last-child{border:0}.stat span{color:var(--muted)}.events{max-height:440px;overflow:auto}.event{border-left:2px solid #3c6680;padding:2px 0 13px 15px;margin-left:7px}.event.special{border-color:var(--cyan)}.event.fail{border-color:var(--red)}.event b{display:block;font-size:12px}.event time{color:var(--muted);font-size:11px}.event p{margin:3px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.empty{color:var(--muted);padding:24px;text-align:center}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}input,textarea,select{background:#0c1729;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font:inherit}input[type=search]{width:min(450px,100%)}textarea{width:100%;min-height:100px;resize:vertical}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.card{background:#142239;border:1px solid var(--line);border-radius:11px;padding:15px}.card h4{font-size:14px;margin:4px 0 7px}.card p{color:var(--muted);margin:5px 0}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.card-footer{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}.source{color:var(--cyan);font-size:11px;overflow-wrap:anywhere}.tabs{display:flex;gap:6px;margin-bottom:18px}.notice{border:1px solid #786238;background:#3d321f;color:#ffe2a8;padding:10px 13px;border-radius:9px;margin-bottom:15px}.ok{border-color:#2c6859;background:#163e37;color:#aef2d8}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:14px;color:var(--text);background:#15233a;width:min(620px,calc(100vw - 30px));padding:0;box-shadow:0 20px 60px #0008}dialog::backdrop{background:#020710b9}dialog header{position:static;padding:16px 20px}dialog .content{padding:20px}dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}label{display:block;color:var(--muted);font-size:12px;margin:14px 0 5px}a{color:var(--cyan)}@media(max-width:900px){.grid,.detail-grid{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(4,1fr)}header{flex-wrap:wrap}nav{margin-left:0}}
  </style>
</head>
<body>
  <header><h1>◈ <span>IntentOS</span></h1><small id="repoLabel">Repository dashboard</small><nav><button class="active" data-tab="live">Live runs</button><button data-tab="policy">Policy</button><button data-tab="knowledge">Knowledge base</button></nav></header>
  <main>
    <div class="hero"><div><div class="eyebrow" id="sectionLabel">Live coordination</div><h2 id="heading">Run activity</h2><div class="sub" id="subtitle">Loading repository…</div></div><div class="sub"><span class="dot"></span><span id="updated">Connecting</span></div></div>
    <div id="message" class="notice hidden"></div>
    <section id="liveView" class="grid"><div class="panel"><h3>Recent runs</h3><div class="runs" id="runList"></div></div><div><div class="panel"><h3>Pipeline</h3><div class="panel-body"><div class="pipeline" id="pipeline"></div><div class="sub" id="runSummary" style="margin-top:16px"></div></div></div><div class="detail-grid"><div class="panel"><h3>Current result</h3><div class="panel-body" id="result"></div></div><div class="panel"><h3>Event timeline</h3><div class="panel-body events" id="events"></div></div></div></div></section>
    <section id="policyView" class="hidden"><div class="toolbar"><input type="search" id="policySearch" placeholder="Search rules, architecture, decisions…"><span class="sub" id="policyCount"></span></div><div class="cards" id="policyCards"></div></section>
    <section id="knowledgeView" class="hidden"><div class="tabs"><button class="active" data-knowledge="precedents">Ticket history</button><button data-knowledge="evidence">Evidence index</button></div><div class="toolbar"><input type="search" id="knowledgeSearch" placeholder="Search tickets, files, symbols, evidence…"><span class="sub" id="knowledgeCount"></span></div><div class="cards" id="knowledgeCards"></div></section>
  </main>
  <dialog id="editor"><header><h1>Edit policy rule</h1></header><div class="content"><div class="meta" id="editId"></div><label for="editStatement">Statement</label><textarea id="editStatement"></textarea><label for="editOption" id="editOptionLabel">Enforcement</label><select id="editOption"></select><div class="sub" style="margin-top:12px">Saving validates the trusted YAML policy and refreshes the repository index. Future runs use the edited rule.</div><div class="actions"><button id="cancelEdit">Cancel</button><button class="primary" id="saveEdit">Save rule</button></div></div></dialog>
  <script>
    const token='__TOKEN__'; const api=(route,options={})=>fetch(route,{...options,headers:{'x-intentos-token':token,'content-type':'application/json',...(options.headers||{})}}).then(async r=>{let v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v});
    const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let currentTab='live',selectedRun=null,live=null,knowledge=null,knowledgeTab='precedents',editing=null,loadingKnowledge=false;
    function message(text,ok=false){const el=$('message');el.textContent=text;el.className='notice'+(ok?' ok':'');if(!text)el.classList.add('hidden')}
    function badge(state){let type=/PASS|READY|MERGED|COMPLETE/.test(state)?'good':/FAIL|BLOCK/.test(state)?'bad':'warn';return `<span class="badge ${type}">${esc(state)}</span>`}
    function stage(state,events){const names=['Evidence','Plan','Implement','Sync','Verify','Review','Merge'];const types=events.map(e=>e.type);let n=state==='CREATED'?0:state==='CONTEXT_RETRIEVED'?1:state==='PLANNING'?1:state==='IMPLEMENTING'?2:state==='REPAIRING'?2:state==='VERIFYING'?4:state==='REVIEW_READY'||state==='HUMAN_REVIEW'?5:state==='MERGED'?6:Math.max(0,types.includes('verification.completed')?4:types.includes('implement.completed')?2:1);return names.map((name,i)=>`<div class="step ${i<n?'done':i===n?'active':''}"><div class="n">0${i+1}</div><strong>${name}</strong></div>`).join('')}
    function eventText(e){let p=e.payload||{};if(e.type==='hook.sync_note')return p.message||'Main changed while the agent was working';if(e.type==='hook.stop_block')return `Agent finish blocked until ${p.issues?.join(', ')||'the change'} is resolved`;if(e.type==='coordination.synced')return `Base advanced ${String(p.from||'').slice(0,8)} → ${String(p.to||'').slice(0,8)}; ${p.issues?.length||0} affected symbol(s)`;if(e.type==='base.advanced')return `Run now verifies against ${String(p.to||'').slice(0,10)}`;if(e.type==='verification.completed')return `Attempt ${p.attempt}: ${p.status}; ${p.blocking||0} blocking finding(s)`;if(e.type==='state.transition')return `${p.from||''} → ${p.to||''}`;if(e.type==='coordination.sync_failed')return p.reason||'Sync failed';return Object.entries(p).slice(0,3).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join(' · ')}
    function renderLive(){if(!live)return;const runs=live.runs||[];$('repoLabel').textContent=live.repo.split('/').pop();$('subtitle').textContent=`${live.repo} · indexed ${live.revision||'not yet'}`;$('updated').textContent='Updated '+new Date(live.now).toLocaleTimeString();$('runList').innerHTML=runs.length?runs.map(r=>`<button class="run ${r.id===live.selected?'active':''}" data-run="${esc(r.id)}"><span class="row"><strong>${esc(r.task_id||r.id.slice(-10))}</strong>${badge(r.merged?'MERGED':r.state)}</span><span class="task">${esc(r.task).slice(0,130)}</span><span class="id">${esc(r.id)} · ${new Date(r.updated_at).toLocaleTimeString()}</span></button>`).join(''):'<div class="empty">No runs yet</div>';
      document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{selectedRun=b.dataset.run;refreshLive()});const run=runs.find(r=>r.id===live.selected);$('pipeline').innerHTML=stage(run?.merged?'MERGED':run?.state||'CREATED',live.events||[]);$('runSummary').innerHTML=run?`${badge(run.state)} &nbsp; ${esc(run.task)}<br><span class="id">${esc(run.id)} · base ${esc(run.base)}</span>`:'Start a run from Codex to watch its stages here.';
      const v=live.verification;let checks=v?.commands||[];$('result').innerHTML=run?`<div class="stat"><span>State</span>${badge(run.merged?'MERGED':run.state)}</div><div class="stat"><span>Verification</span>${v?badge(v.status.toUpperCase()):'<span>Waiting</span>'}</div><div class="stat"><span>Coordination</span><b>${v?.coordination?.stale?'Stale':v?.coordination?'Up to date':'Waiting'}</b></div><div class="stat"><span>Checks passed</span><b>${checks.filter(c=>c.status==='passed').length} / ${checks.length}</b></div><div class="stat"><span>Attempts</span><b>${v?.attempt||'—'}</b></div>`:'<div class="empty">Select a run</div>';
      $('events').innerHTML=(live.events||[]).slice().reverse().slice(0,35).map(e=>`<div class="event ${/sync|base/.test(e.type)?'special':/fail/.test(e.type)?'fail':''}"><time>${new Date(e.at).toLocaleTimeString()}</time><b>${esc(e.type)}</b><p>${esc(eventText(e))}</p></div>`).join('')||'<div class="empty">Waiting for events</div>'}
    function policyRows(){const p=knowledge?.policy;if(!p)return [];return [...(p.invariants||[]).map(x=>({...x,kind:'invariants'})),...(p.architecture_rules||[]).map(x=>({...x,kind:'architecture_rules'})),...(p.decisions||[]).map(x=>({...x,kind:'decisions'}))]}
    function renderPolicy(){const rows=policyRows(),q=$('policySearch').value.toLowerCase(),filtered=rows.filter(x=>`${x.id} ${x.statement} ${x.kind} ${JSON.stringify(x.sources||[])}`.toLowerCase().includes(q));$('policyCount').textContent=`${filtered.length} of ${rows.length} rules · ${knowledge?.policy?.policy_id||'no policy'}`;$('policyCards').innerHTML=filtered.map(x=>`<article class="card"><div class="row"><span class="eyebrow">${esc(x.kind.replace('_',' '))}</span> ${badge(x.kind==='decisions'?x.status:x.enforcement)}</div><h4>${esc(x.id)}</h4><p>${esc(x.statement)}</p><div class="meta">${esc(x.approved_by||'')} ${x.verified_by?.length?'· '+x.verified_by.length+' test(s)':''}</div><div class="card-footer"><span class="source">${esc((x.sources||[]).map(s=>s.path+(s.line_start?':'+s.line_start:'')).join(' · ')||'No source link')}</span><button data-edit="${esc(x.kind)}:${esc(x.id)}">Edit</button></div></article>`).join('')||'<div class="empty">No matching rules</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit))}
    function renderKnowledge(){let q=$('knowledgeSearch').value.toLowerCase();let rows=knowledgeTab==='precedents'?(knowledge?.precedents||[]):(knowledge?.evidence||[]);let filtered=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('knowledgeCount').textContent=`${filtered.length} of ${rows.length} ${knowledgeTab}`;$('knowledgeCards').innerHTML=filtered.slice(0,180).map(x=>knowledgeTab==='precedents'?`<article class="card"><div class="eyebrow">Ticket #${x.number}</div><h4>${esc(x.title)}</h4><p>${esc((x.labels||[]).join(' · ')||'Resolved ticket')}</p><div class="meta">${esc(x.pull?.symbols?.join(', ')||x.pull?.files?.map(f=>f.path).join(', ')||'No linked code')}</div><div class="card-footer"><a href="${esc(x.url)}" target="_blank" rel="noopener">Ticket ↗</a>${x.pull?.url?`<a href="${esc(x.pull.url)}" target="_blank" rel="noopener">PR ↗</a>`:''}</div></article>`:`<article class="card"><div class="eyebrow">${esc(x.source_type)} · ${esc(x.authority)}</div><h4>${esc(x.summary||x.path||x.id)}</h4><p>${esc(x.path||x.source_ref||'')}</p><div class="meta">${esc(x.status)} ${x.line_start?'· lines '+x.line_start+(x.line_end?'–'+x.line_end:''):''}</div></article>`).join('')||'<div class="empty">No matching items</div>'}
    function openEditor(key){const [kind,id]=key.split(':');editing=policyRows().find(x=>x.kind===kind&&x.id===id);if(!editing)return;$('editId').textContent=`${editing.id} · ${kind.replace('_',' ')}`;$('editStatement').value=editing.statement;$('editOptionLabel').textContent=kind==='decisions'?'Status':'Enforcement';$('editOption').innerHTML=(kind==='decisions'?['approved','proposed','superseded','rejected']:['blocking','advisory']).map(v=>`<option value="${v}">${v}</option>`).join('');$('editOption').value=kind==='decisions'?editing.status:editing.enforcement;$('editor').showModal()}
    $('cancelEdit').onclick=()=>$('editor').close();$('saveEdit').onclick=async()=>{if(!editing)return;const button=$('saveEdit');button.disabled=true;try{const result=await api('/api/policy/edit',{method:'POST',body:JSON.stringify({kind:editing.kind,id:editing.id,statement:$('editStatement').value,[editing.kind==='decisions'?'status':'enforcement']:$('editOption').value,policy_hash:knowledge.policy_hash})});$('editor').close();await refreshKnowledge();message(result.warning||`Saved ${editing.id}; index ${result.index||'unchanged'}`,!result.warning)}catch(e){message(e.message)}finally{button.disabled=false}};
    async function refreshLive(){try{live=await api('/api/live'+(selectedRun?'?run='+encodeURIComponent(selectedRun):''));renderLive()}catch(e){message(e.message)}}
    async function refreshKnowledge(){if(loadingKnowledge)return;loadingKnowledge=true;try{knowledge=await api('/api/knowledge');renderPolicy();renderKnowledge()}catch(e){message(e.message)}finally{loadingKnowledge=false}}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['live','policy','knowledge'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==currentTab));$('heading').textContent={live:'Run activity',policy:'Approved policy',knowledge:'Repository knowledge'}[currentTab];$('sectionLabel').textContent={live:'Live coordination',policy:'Human editable rules',knowledge:'Evidence and history'}[currentTab];if(currentTab!=='live')refreshKnowledge()});
    document.querySelectorAll('[data-knowledge]').forEach(b=>b.onclick=()=>{knowledgeTab=b.dataset.knowledge;document.querySelectorAll('[data-knowledge]').forEach(x=>x.classList.toggle('active',x===b));renderKnowledge()});$('policySearch').oninput=renderPolicy;$('knowledgeSearch').oninput=renderKnowledge;
    refreshLive();refreshKnowledge();setInterval(()=>{if(currentTab==='live')refreshLive()},2000);setInterval(()=>{if(currentTab!=='live')refreshKnowledge()},15000);
  </script>
</body>
</html>
