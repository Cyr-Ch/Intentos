[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeguard"
version = "0.1.0"
description = "Main is the meeting point: a deterministic coordination harness for coding agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
authors = [{name = "Cyr-Ch"}]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mergeguard = "mergeguard.__main__:main"

[tool.setuptools.packages.find]
include = ["mergeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
