schema_version: "1.0"
policy_id: oemof_demand
description: >
  DRAFT generated by `intentos onboard` on 2026-10-26 for demandlib. Commands and path lists were derived from the repository layout (src layout; packages: oemof). Invariants, architecture rules and decisions are empty on purpose: they carry authority in every run and must be written and approved by a person. See docs/policies.md.
applies_to:
  project_name: "oemof.demand"
  path_basename: "demandlib"

# Globs the implementer may edit (the planner narrows these per task) and globs it must never edit.
default_allowed_paths:
  - "src/**"
  - "tests/**"
protected_paths:
  - "docs/**"
  - "AUTHORS.rst"
  - "CHANGELOG.rst"
  - "CONTRIBUTING.rst"
  - "LICENSE"
  - "MANIFEST.in"
  - "README.rst"
  - "pyproject.toml"
  - "tox.ini"
  - ".github/**"

# Tags by path glob: decide which invariants/rules apply to a task and help retrieval. Refine the tags.
scope_tags:
  "src/oemof/**": [ oemof ]
  "tests/**": [ tests ]

# Task-term synonyms to help lexical retrieval, e.g. { invoice: [invoices, billing] }.
synonyms: {}

# Trusted verification commands. argv placeholders: {python} {snapshot} {hidden_tests_dir} {junit}.
# Verification runs from a snapshot copy of the implementer's worktree, so tests must import the code via
# pythonpath (never an editable install of your clone). pytest also reads the repository's own configuration
# from the snapshot (pyproject.toml:[tool.pytest.ini_options], addopts "-ra --strict-markers --ignore=docs/conf.py --ignore=.eggs --doctest-modules --doctest-glob=\\*.rst --tb=short --pyargs"); the implementer can edit that file, so pin anything that must not change here (e.g. "-o", "addopts=").
commands:
  pytest_project:
    description: Project test suite from the verification snapshot (editable by the implementer; lower authority than hidden tests)
    track: functional
    argv: [ "{python}", "-m", "pytest", "src", "tests", "docs", "-q", "-p", "no:cacheprovider", "-o", "pythonpath=src tests", "--junit-xml={junit}" ]
    timeout_s: 900
  scope_check:
    description: Changed files must stay inside allowed paths and outside protected paths
    track: scope
    builtin: scope_check
  architecture_rules:
    description: Deterministic AST checks for the approved architecture rules below
    track: architecture
    builtin: architecture_rules
  architecture_surprise:
    description: Architectural-surprise review signals (new cross-module dependencies, duplicate helpers, domain construction in the API layer); advisory
    track: architecture
    builtin: architecture_surprise
    enforcement: advisory

# Business invariants: approved statements whose sources are Markdown sections in the repository and whose hidden
# tests live in benchmarks/hidden_tests/oemof_demand/invariants/ (outside the implementer's reach).
# No Markdown documents found: add e.g. docs/intentos-policy.md with one heading per rule (reStructuredText is not indexed).
# Example:
#   - id: INV-001
#     statement: <one sentence a reviewer can verify>
#     scope: [oemof]
#     applies_to_paths: ["src/**"]
#     authority: approved_policy
#     approved_by: <owner>
#     sources: [{ path: docs/intentos-policy.md, heading: <section heading> }]
#     verified_by: [benchmarks/hidden_tests/oemof_demand/invariants/test_inv_001_<name>.py]
invariants:
  - id: INV-001
    statement: Calling tools.add_weekdays2df with holidays=[] must emit no warnings and produce no weekday values of 0.
    scope:
      - demand
      - tools
      - bdew
    applies_to_paths:
      - src/oemof/demand/tools.py
      - src/oemof/demand/**
      - src/oemof/demand/bdew/**
    authority: approved_policy
    approved_by: QTG2659
    sources:
      - path: docs/intentos-policy.md
        heading: No warning with empty holidays
    verified_by:
      - benchmarks/hidden_tests/oemof_demand/invariants/test_inv_001_no_warning_with_empty_holidays.py
      - benchmarks/hidden_tests/oemof_demand/invariants/test_inv_001_frame_without_holidays.py
      - benchmarks/hidden_tests/oemof_demand/invariants/test_inv_001_warning_without_holidays.py
    enforcement: blocking
  - id: INV-002
    statement: Negative typical day factors must emit UserWarning containing "was negative, see VDI 4655" while get_load_curve_houses returns non-empty load_curves.
    scope:
      - vdi
      - regions
    applies_to_paths:
      - src/oemof/demand/vdi/regions.py
    authority: approved_policy
    approved_by: QTG2659
    sources:
      - path: docs/intentos-policy.md
        heading: Negative factors warning
    verified_by:
      - benchmarks/hidden_tests/oemof_demand/invariants/test_inv_002_negative_factors_warning.py
    enforcement: blocking
  - id: INV-003
    statement: Zero Q_Heiz_a must result in an all-zero Q_Heiz_TT load curve.
    scope:
      - vdi
      - regions
    applies_to_paths:
      - src/oemof/demand/vdi/regions.py
    authority: approved_policy
    approved_by: QTG2659
    sources:
      - path: docs/intentos-policy.md
        heading: Energy demand zero sum
    verified_by:
      - benchmarks/hidden_tests/oemof_demand/invariants/test_inv_003_energy_demand_zero_sum.py
    enforcement: blocking
  - id: INV-004
    statement: Retrieving only the warm water profile must be allowed.
    scope:
      - bdew
      - heat_building
    applies_to_paths:
      - src/oemof/demand/bdew/heat_building.py
    authority: approved_policy
    approved_by: QTG2659
    sources:
