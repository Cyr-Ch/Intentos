# Deterministic architecture rules: forbidden_import | forbidden_call | frozen_paths | required_import | forbidden_names.
# Example:
#   - id: ARCH-001
#     kind: forbidden_import
#     statement: Library code must not talk to the network or spawn processes.
#     paths: ["src/**"]
#     forbidden_modules: [requests, urllib, httpx, socket, subprocess]
#     authority: approved_policy
#     approved_by: <owner>
architecture_rules: []

# Architectural decisions (ADR-style): id DEC-nnn, statement, status approved|superseded|proposed|rejected, sources.
decisions: []

# Architectural-surprise detectors (advisory). Fill api_paths/domain_paths when the repository has such layers.
architecture_surprise:
  api_paths: []
  domain_paths: []
  ignore_names: []
