schema_version: "1.0"
policy_id: ts_ledger
language: typescript
description: >
  Trusted verification configuration for the ts_ledger fixture, the TypeScript counterpart of
  startup_billing. Hidden tests are vitest modules run through a wrapper config from the
  verification snapshot; architecture rules are checked with the TypeScript compiler API.

applies_to:
  project_name: "ts-ledger"
  path_basename: "ts_ledger"

default_allowed_paths:
  - "src/**"
  - "tests/**"

protected_paths:
  - "docs/**"
  - "README.md"
  - "package.json"
  - "tsconfig.json"
  - "vitest.config.ts"

scope_tags:
  "src/domain/**": [domain, money, ledger]
  "src/db/**": [storage, db]
  "src/api/**": [api, handlers]
  "tests/**": [tests]

synonyms:
  balance: [balances, funds]
  transfer: [transfers, move]
  overdraft: [negative, insufficient]

commands:
  test_project:
    description: Project vitest suite from the verification snapshot (editable by the implementer; lower authority than hidden tests)
    track: functional
    argv: ["{node}", "{node_modules}/vitest/vitest.mjs", "run", "--root", "{snapshot}", "--reporter=junit", "--outputFile={junit}", "--passWithNoTests", "--exclude", "**/.intentos_hidden/**", "--exclude", "**/node_modules/**"]
    timeout_s: 600
  hidden_task_tests:
    description: Hidden task acceptance tests authored before implementation (outside the implementer's writable area)
    track: functional
    argv: ["{node}", "{node_modules}/vitest/vitest.mjs", "run", "--root", "{snapshot}", "--dir", "{hidden_tests_dir}/task", "--config", "{hidden_tests_dir}/vitest.config.mjs", "--reporter=junit", "--outputFile={junit}", "--passWithNoTests"]
    timeout_s: 600
    requires_task_tests: true
  hidden_invariants:
    description: Hidden invariant tests bound to approved policy
    track: business_invariant
    argv: ["{node}", "{node_modules}/vitest/vitest.mjs", "run", "--root", "{snapshot}", "--dir", "{hidden_tests_dir}/invariants", "--config", "{hidden_tests_dir}/vitest.config.mjs", "--reporter=junit", "--outputFile={junit}", "--passWithNoTests"]
    timeout_s: 600
  architecture_rules:
    description: Deterministic checks for approved architecture rules (TypeScript compiler API)
    track: architecture
    builtin: architecture_rules
  scope_check:
    description: Changed files must stay inside allowed paths and outside protected paths
    track: scope
    builtin: scope_check

invariants:
  - id: INV-001
    statement: Amounts in different currencies are never added or subtracted; the domain throws CurrencyMismatch instead of converting.
    scope: [money, domain]
    applies_to_paths: ["src/domain/**", "src/api/**"]
    authority: approved_policy
    approved_by: ledger-owner
    sources:
      - path: docs/invariants.md
        heading: Money
    verified_by:
      - benchmarks/hidden_tests/ts_ledger/invariants/inv_001_currency_mismatch.test.ts
    enforcement: blocking
  - id: INV-002
    statement: An account balance never goes below zero through Ledger.post; overdrafts throw InsufficientFunds before anything is recorded.
    scope: [ledger, balance, overdraft, domain]
    applies_to_paths: ["src/domain/**", "src/api/**"]
    authority: approved_policy
    approved_by: ledger-owner
    sources:
      - path: docs/invariants.md
        heading: Balances
    verified_by:
      - benchmarks/hidden_tests/ts_ledger/invariants/inv_002_balance_never_negative.test.ts
    enforcement: blocking

architecture_rules:
  - id: ARCH-001
    kind: forbidden_import
    statement: Request handlers go through the Ledger repository interface; src/api must not import src/db.
    paths: ["src/api/**"]
    forbidden_modules: [src/db]
    authority: approved_decision
    approved_by: cto
    scope: [api, storage]
    sources:
      - path: docs/invariants.md
        heading: Layering
    enforcement: blocking
  - id: ARCH-002
    kind: forbidden_import
    statement: Domain code is pure; it must not import storage, the API layer, or Node I/O modules.
    paths: ["src/domain/**"]
    forbidden_modules: [src/db, src/api, "node:fs", fs, "node:http", http, "node:child_process", child_process]
    authority: approved_decision
    approved_by: cto
    scope: [domain]
    sources:
      - path: docs/invariants.md
        heading: Layering
    enforcement: blocking

decisions: []
